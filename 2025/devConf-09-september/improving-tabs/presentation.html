</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="1" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">

<h3 id="time">Time</h3>
<ul>
<li data-marpit-fragment="1">&quot;In most situations, the faster a user can complete a task, the better the experience.&quot; <small>Tom Tullis, Bill Albert. Measuring the User Experience.</small></li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-fragments="4" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h3 id="number-of-actions--lostness">Number of Actions &amp; lostness</h3>
<ul>
<li data-marpit-fragment="1">clicks and triggers require physical and mental activity</li>
<li data-marpit-fragment="2">lowering the number of total actions <strong>feels better and less straining</strong></li>
<li data-marpit-fragment="3">lostness
<ul>
<li data-marpit-fragment="4">&quot;The total number of pages visited while performing the task, counting revisits to the same page&quot; versus &quot;The minimum (optimum) number of pages that must be visited to accomplish the task&quot; <small>Tom Tullis, Bill Albert. Measuring the User Experience.</small></li>
</ul>
</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="2" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h3 id="user-intent-and-mental-model">User Intent and Mental Model</h3>
<ul>
<li data-marpit-fragment="1">the <strong>user intent</strong>: &quot;the purpose of a user’s series of actions&quot; <small><a href="https://uxdesign.cc/a-gentle-introduction-to-orchestrating-intelligent-journeys-with-user-intent-graphs-503192a637e2">Ciprian Borodescu. A gentle introduction to orchestrating intelligent journeys with User Intent Graphs.</a></small></li>
<li data-marpit-fragment="2">the <strong>mental model</strong>: &quot;what users know (or think they know) about a system&quot; <small><a href="https://www.nngroup.com/articles/mental-models/">Jakob Nielsen. Mental Models.</a></small></li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="3" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">

<li data-marpit-fragment="1">&quot;In 1956, [George A.] Miller found that most people can remember about 7 chunks of information in their short-term memory.&quot;</li>
<li data-marpit-fragment="2">982184652390 vs. 9821 8465 2390</li>
<li data-marpit-fragment="3">grouping</li>
</ul>

<li data-marpit-fragment="1">What counts as an object or sub-object?

<li data-marpit-fragment="3">Calendar, Question, Comment</li>
</ul>
</li>
<li data-marpit-fragment="4">What counts as a setting?
<ul>

</ul>
</li>

<ul>

<h3 id="what-are-tabs-for">What are Tabs for?</h3>
<blockquote>
<p>&quot;In-page tabs organize and present related content within a single page. These tabs are not for navigation but enable users to alter the content displayed in the panel.&quot;</p>
</blockquote>
<p><small>Evan Sunwall. Tabs, Used Right. nngroup.com. August 2nd, 2024. <a href="https://www.nngroup.com/articles/tabs-used-right/">https://www.nngroup.com/articles/tabs-used-right/</a></small></p>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<blockquote>
<p>&quot;Navigation tabs enable users to navigate to different pages. Because navigation usability improves when the user’s location is clearly marked, designers started using the visual presentation of tabs (in particular, selection indicators) for navigation controls. Over time, this tab styling became a common visual approach to navigation.&quot;</p>
</blockquote>
<p><small>Evan Sunwall. Tabs, Used Right. nngroup.com. August 2nd, 2024. <a href="https://www.nngroup.com/articles/tabs-used-right/">https://www.nngroup.com/articles/tabs-used-right/</a></small></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-marpit-fragments="5" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h3 id="approach-2-general-user-intent">Approach 2: General User Intent</h3>
<ul>
<li data-marpit-fragment="1">View (Explore / Learn / Launch)</li>
<li data-marpit-fragment="2">Edit (Create / Manage) {Name of (Sub-Object)}</li>
<li data-marpit-fragment="3">Assign (Connect) {Sub-Object}</li>
<li data-marpit-fragment="4">{Object Name} Settings</li>
<li data-marpit-fragment="5">Evaluate (Analyze)</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-fragments="3" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h4 id="view-explore--learn--launch">View (Explore / Learn / Launch)</h4>
<ul>
<li data-marpit-fragment="1">Content just to view without or with very little interaction</li>
<li data-marpit-fragment="2">Content for the user to interact with and work through (e.g. a test)</li>
<li data-marpit-fragment="3">adding Sub-Objects and items while interacting with created content (e.g. comments)</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-marpit-fragments="4" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h4 id="edit-create--manage-name-of-sub-object">Edit (Create / Manage) {Name of (Sub-Object)}</h4>
<ul>
<li data-marpit-fragment="1">Page Editor Content</li>
<li data-marpit-fragment="2">Sub-Objects like Repository Objects served as part of the content</li>
<li data-marpit-fragment="3">Sub-Objects or items making up a sequence or segmented collection of contents (Questions, Blog-Posts)</li>
<li data-marpit-fragment="4">Templates e.g. for Certificates</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-marpit-fragments="2" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h4 id="assign-connect">Assign (Connect)</h4>
<p>Whenever one object needs to be paired with another like...</p>
<ul>
<li data-marpit-fragment="1">assigning Users as Participants or Members</li>
<li data-marpit-fragment="2">connecting Qualifications with Questions</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-marpit-fragments="4" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h5 id="object-name-settings">{Object Name} Settings</h5>
<p>Anything that can be changed about the current (sub-)object and how it behaves (excluding what content is in it or what is connected to it).</p>
<ul>
<li data-marpit-fragment="1">Settings of Behavior (how to serve content, how to process User interaction)</li>
<li data-marpit-fragment="2">Availability</li>
<li data-marpit-fragment="3">Permissions</li>
<li data-marpit-fragment="4">Learning Progress Settings (how it is tracked)</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-marpit-fragments="4" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h4 id="evaluate-analyze">Evaluate (Analyze)</h4>
<p>Analytics and Reports. Content and sub-object created by the consuming user that are part of an evaluation process (Test Answers, Survey Answers)</p>
<ul>
<li data-marpit-fragment="1">Data &amp; Statistics generated from User interaction with the object and its sub-objects</li>
<li data-marpit-fragment="2">Data and content submitted by a consuming User</li>
<li data-marpit-fragment="3">Learning Progress (what was tracked)</li>
<li data-marpit-fragment="4">Manual Scoring</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-class="chapter-02" data-theme="cate-theme" lang="en-US" class="chapter-02" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--class:chapter-02;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>

<h2 id="minimum-tweaks"><strong>Minimum Tweaks</strong></h2>
<h3 id="the-minimum-action-we-would-recommend-is-to-clean-up-worst-offenders"><strong>The minimum action we would recommend is to clean up worst offenders</strong></h3>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-marpit-fragments="6" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<ul>
<li data-marpit-fragment="1">&quot;back&quot; or &quot;back up&quot; buttons should move out of the Tab area</li>
<li data-marpit-fragment="2">avoid duplicated options across Toolbar, Tabs, Sub-Tabs and Dropdowns</li>
<li data-marpit-fragment="3">reduce number of Tabs and move content into Sub-Tabs where possible</li>
<li data-marpit-fragment="4">Actions should never be in the Tab as both Mental Models for Tabs only reveal or go to content.</li>
<li data-marpit-fragment="5">Toolbar and Dropdown Actions should not lead to a settings page. Settings pages are clearly the main purpose of Tabs.</li>
<li data-marpit-fragment="6">the Toolbar location is deprecated as part of the Removing LUI projects (e.g. attach them to the Table component that they control)</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-marpit-fragments="4" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
<header>ILIAS DevConf September 2023 | cate-tms.de</header>
<h2 id="conclusion">Conclusion</h2>
<ul>
<li data-marpit-fragment="1">ILIAS could benefit from bringing User Intent into the interface.</li>
<li data-marpit-fragment="2">Tabs are still one of the best ways to navigate between a collections of views.</li>
<li data-marpit-fragment="3">A break in a pattern indicates that a system or grouping could be optimized.</li>
<li data-marpit-fragment="4">By following User Intent we can sort and nest Tabs in ways that feel more intuitive and frictionless to our users.</li>
</ul>
<footer>No ILIAS on a dead planet.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-marpit-fragments="2" data-header="ILIAS DevConf September 2023 | cate-tms.de" data-footer="No ILIAS on a dead planet." data-theme="cate-theme" lang="en-US" style="--header:ILIAS DevConf September 2023 | cate-tms.de;--footer:No ILIAS on a dead planet.;--theme:cate-theme;">
